<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1120" viewBox="0 0 600 1120" lang="ja" role="img" aria-labelledby="title desc"><title id="title">15,000円の返済と、今回の残り5,000円をひとつの流れで確認する、貸した側の説明用イメージ</title><desc id="desc">説明用のイメージです。実際のアプリ画面ではありません。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f9e9"/><stop offset="1" stop-color="#edf3fa"/></linearGradient></defs><rect width="600" height="1120" rx="32" fill="url(#bg)"/><path d="M64 260V870" stroke="#a4c28b" stroke-width="4"/><rect x="78" y="238" width="470" height="196" rx="24" fill="#fff" stroke="#dfe7e3"/><rect x="78" y="468" width="470" height="204" rx="24" fill="#fff" stroke="#dfe7e3"/><rect x="78" y="706" width="470" height="194" rx="24" fill="#fff" stroke="#dfe7e3"/><circle cx="64" cy="280" r="9" fill="#527938"/><circle cx="64" cy="510" r="9" fill="#527938"/><circle cx="64" cy="748" r="9" fill="#527938"/><g fill="#18212b" font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif"><text x="56" y="76" font-size="22" font-weight="400">記録のつながり</text><text x="56" y="132" font-size="34" font-weight="700">悠太さんとのやり取り</text><text x="56" y="180" font-size="23" font-weight="400">パソコン購入代の貸し借り</text><text x="94" y="290" font-size="22" font-weight="400">11月1日</text><text x="94" y="340" font-size="27" font-weight="700">返済を記録</text><text x="94" y="392" font-size="31" font-weight="700">15,000円を受け取り</text><text x="94" y="520" font-size="22" font-weight="400">返済計画</text><text x="94" y="570" font-size="27" font-weight="700">今回の未返済分</text><text x="94" y="628" font-size="38" font-weight="700">5,000円</text><text x="94" y="754" font-size="22" font-weight="400">次に確認すること</text><text x="94" y="804" font-size="27" font-weight="700">11月1日が期日</text><text x="94" y="854" font-size="24" font-weight="400">記録を見て、必要なら連絡</text><text x="56" y="1034" font-size="22" font-weight="400">架空の例・貸した側の記録</text></g></svg>
