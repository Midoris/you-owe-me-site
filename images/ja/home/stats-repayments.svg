<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" lang="ja" role="img" aria-labelledby="title desc"><title id="title">返済の履歴</title><desc id="desc">悠太さんから5月9日に10,000円、5月22日に8,000円の返済を受けた架空の記録例</desc><rect x="1" y="1" width="598" height="998" rx="36" fill="#fbfdff" stroke="#dfe6eb"/><g font-family="-apple-system, BlinkMacSystemFont, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif" fill="#18212b"><text x="44" y="100" font-size="26">悠太さんとの記録</text><text x="44" y="170" font-size="40" font-weight="700">返済の履歴</text><path d="M44 250H556M44 390H556M44 530H556" stroke="#dfe6eb"/><text x="44" y="330" font-size="30">5月9日</text><text x="556" y="330" text-anchor="end" font-size="40" font-weight="700">10,000円</text><text x="44" y="470" font-size="30">5月22日</text><text x="556" y="470" text-anchor="end" font-size="40" font-weight="700">8,000円</text><text x="44" y="650" font-size="28">返済済みの合計</text><text x="44" y="730" font-size="54" font-weight="700">18,000円</text><text x="44" y="910" font-size="26" fill="#52616c">架空の記録例</text></g></svg>