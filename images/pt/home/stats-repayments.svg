<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" lang="pt-BR" role="img" aria-labelledby="title desc">
  <title id="title">Pagamentos recebidos</title>
  <desc id="desc">Exemplo fictício: Lucas devolveu R$ 100 em 9 de maio e R$ 80 em 22 de maio</desc>
  <rect x="1" y="1" width="598" height="998" rx="36" fill="#fbfdff" stroke="#dfe6eb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#18212b">
    <text x="44" y="95" font-size="26" fill="#52616c">Registro com Lucas</text>
    <text x="44" y="165" font-size="40" font-weight="700"><tspan x="44">Pagamentos</tspan><tspan x="44" dy="52">recebidos</tspan></text>
    <path d="M44 280H556M44 420H556M44 560H556" stroke="#dfe6eb"/>
    <text x="44" y="360" font-size="30">9 de maio</text>
    <text x="556" y="360" text-anchor="end" font-size="40" font-weight="700">R$ 100</text>
    <text x="44" y="500" font-size="30">22 de maio</text>
    <text x="556" y="500" text-anchor="end" font-size="40" font-weight="700">R$ 80</text>
    <text x="44" y="680" font-size="28">Total recebido</text>
    <text x="44" y="760" font-size="54" font-weight="700">R$ 180</text>
    <text x="44" y="915" font-size="26" fill="#52616c">Exemplo fictício</text>
  </g>
</svg>
