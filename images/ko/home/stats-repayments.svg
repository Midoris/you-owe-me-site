<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">돌려받은 내역</title>
  <desc id="desc">가상 예시: 민준이 5월 9일 100,000원, 5월 22일 80,000원을 돌려줌</desc>
  <rect x="1" y="1" width="598" height="998" rx="36" fill="#fbfdff" stroke="#dfe6eb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#18212b">
    <text x="44" y="95" font-size="26" fill="#52616c">민준과의 기록</text>
    <text x="44" y="165" font-size="40" font-weight="700">돌려받은 내역</text>
    <path d="M44 280H556M44 420H556M44 560H556" stroke="#dfe6eb"/>
    <text x="44" y="360" font-size="30">5월 9일</text>
    <text x="556" y="360" text-anchor="end" font-size="40" font-weight="700">100,000원</text>
    <text x="44" y="500" font-size="30">5월 22일</text>
    <text x="556" y="500" text-anchor="end" font-size="40" font-weight="700">80,000원</text>
    <text x="44" y="680" font-size="28">돌려받은 돈 합계</text>
    <text x="44" y="760" font-size="54" font-weight="700">180,000원</text>
    <text x="44" y="915" font-size="26" fill="#52616c">가상의 금액으로 만든 예시</text>
  </g>
</svg>
