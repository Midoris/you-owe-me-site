<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000" lang="ko" role="img" aria-labelledby="title desc">
  <title id="title">돌려받은 돈과 남은 돈</title>
  <desc id="desc">설명용 예시: 민준 대신 낸 340,000원 중 180,000원을 돌려받아 160,000원이 남음</desc>
  <rect x="1" y="1" width="598" height="998" rx="36" fill="#fbfdff" stroke="#dfe6eb"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#18212b">
    <text x="44" y="95" font-size="26" fill="#52616c">정산 요약</text>
    <text x="44" y="165" font-size="40" font-weight="700"><tspan x="44">돌려받은 돈과</tspan><tspan x="44" dy="52">남은 돈</tspan></text>
    <text x="44" y="325" font-size="28">민준 대신 낸 돈</text>
    <text x="44" y="396" font-size="54" font-weight="700">340,000원</text>
    <rect x="44" y="455" width="512" height="40" rx="20" fill="#e1e8ec"/>
    <path d="M64 455H315.0588V495H64A20 20 0 0 1 64 455" fill="#afe67e"/>
    <text x="44" y="600" font-size="28">돌려받은 돈</text>
    <text x="44" y="665" font-size="48" font-weight="700">180,000원</text>
    <text x="44" y="800" font-size="28">남은 금액</text>
    <text x="44" y="865" font-size="48" font-weight="700">160,000원</text>
    <text x="44" y="945" font-size="26" fill="#52616c">가상의 금액으로 만든 예시</text>
  </g>
</svg>
