<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" lang="fr" xml:lang="fr" role="img" aria-labelledby="title desc">
  <title id="title">Découvrez You Owe Me en action</title>
  <desc id="desc">Affiche illustrative d’une vidéo en anglais sur les remboursements, les dépenses partagées et les rappels. Ceci n’est pas une capture de l’application.</desc>
  <defs><linearGradient id="bg" x2="0.8" y2="1"><stop stop-color="#e5f4d8"/><stop offset="1" stop-color="#e4eef8"/></linearGradient></defs>
  <rect width="480" height="720" rx="32" fill="url(#bg)"/>
  <rect x="32" y="42" width="416" height="636" rx="26" fill="#fff" fill-opacity=".88" stroke="#dfe6eb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#18212b">
    <text x="240" y="128" font-size="29" font-weight="700">You Owe Me</text>
    <text x="240" y="190" font-size="27" font-weight="700">L’application en action</text>
    <text x="240" y="242" font-size="23">Vidéo en anglais</text>
    <circle cx="240" cy="350" r="66" fill="#afe67e"/>
    <path d="M222 318 L222 382 L271 350 Z" fill="#18212b"/>
    <text x="240" y="465" font-size="25">Remboursements</text>
    <text x="240" y="507" font-size="25">Dépenses partagées et rappels</text>
    <text x="240" y="595" font-size="18" fill="#52616c">Affiche illustrative</text>
    <text x="240" y="624" font-size="18" fill="#52616c">Pas une capture de l’application</text>
  </g>
</svg>
